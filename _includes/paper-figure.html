{% comment %}
  Figure reproduced from one of the papers (shown on a white card so it reads in dark mode too).
  Usage: {% include paper-figure.html src="paper/newton-superres.webp" alt="..." caption="..." %}
{% endcomment %}
<figure class="paper-figure{% if include.narrow %} paper-figure--narrow{% endif %}">
  <div class="paper-figure__card"{% if include.width %} style="max-width: {{ include.width }}"{% endif %}><img src="{{ '/images/research/' | append: include.src | relative_url }}" alt="{{ include.alt | escape }}" loading="lazy"></div>
  {% if include.caption %}<figcaption>{{ include.caption | markdownify | remove: '<p>' | remove: '</p>' }}</figcaption>{% endif %}
</figure>
