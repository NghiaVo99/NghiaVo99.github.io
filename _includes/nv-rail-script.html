<script>
  (function () {
    var rail = document.querySelector('[data-rail]');
    if (!rail) return;
    var profile = rail.querySelector('[data-rail-profile]');
    var context = rail.querySelector('[data-rail-context]');
    var head = document.querySelector('.page-head');
    var desktop = window.matchMedia('(min-width: 64rem)');

    function setState(state) {
      if (rail.getAttribute('data-state') === state) return;
      rail.setAttribute('data-state', state);
      if (!context) return;
      var showContext = state === 'context' || !desktop.matches;
      context.toggleAttribute('inert', !showContext);
      context.setAttribute('aria-hidden', showContext ? 'false' : 'true');
      var showProfile = state === 'profile' && desktop.matches;
      profile.toggleAttribute('inert', !showProfile);
      profile.setAttribute('aria-hidden', showProfile ? 'false' : 'true');
    }

    var ticking = false;
    function update() {
      ticking = false;
      if (!context) return;
      if (!desktop.matches) { rail.setAttribute('data-state', 'context'); context.removeAttribute('inert'); context.setAttribute('aria-hidden', 'false'); return; }
      var threshold = head ? head.getBoundingClientRect().bottom : 200;
      setState(threshold < 96 ? 'context' : 'profile');
    }
    function onScroll() { if (!ticking) { ticking = true; requestAnimationFrame(update); } }

    if (context) {
      context.setAttribute('inert', '');
      context.setAttribute('aria-hidden', 'true');
      window.addEventListener('scroll', onScroll, { passive: true });
      window.addEventListener('resize', onScroll);
      if (desktop.addEventListener) desktop.addEventListener('change', function () { rail.removeAttribute('data-state'); update(); });
      update();
    }

    var top = rail.querySelector('[data-rail-top]');
    if (top) top.addEventListener('click', function (e) { e.preventDefault(); window.scrollTo({ top: 0, behavior: 'smooth' }); });

    // Highlight the section currently in view
    var links = rail.querySelectorAll('.toc a');
    if (!('IntersectionObserver' in window) || !links.length) return;
    var map = {};
    links.forEach(function (a) { map[a.getAttribute('href').slice(1)] = a; });
    var obs = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (!e.isIntersecting) return;
        links.forEach(function (a) { a.removeAttribute('aria-current'); });
        var a = map[e.target.id];
        if (a) a.setAttribute('aria-current', 'true');
      });
    }, { rootMargin: '-15% 0px -70% 0px' });
    Object.keys(map).forEach(function (id) { var el = document.getElementById(id); if (el) obs.observe(el); });
  })();
</script>
