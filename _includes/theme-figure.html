{% comment %}
  Figure with a light and a dark variant (images/research/NAME.svg and NAME-dark.svg).
  Usage: {% include theme-figure.html name="polyhedral-idea" alt="..." caption="..." %}
{% endcomment %}
<figure class="theme-figure"{% if include.width %} style="max-width: {{ include.width }}"{% endif %}>
  <img class="theme-figure__light" src="{{ '/images/research/' | append: include.name | append: '.svg' | relative_url }}" alt="{{ include.alt | escape }}" loading="lazy">
  <img class="theme-figure__dark" src="{{ '/images/research/' | append: include.name | append: '-dark.svg' | relative_url }}" alt="" aria-hidden="true" loading="lazy">
  {% if include.caption %}<figcaption>{{ include.caption | markdownify | remove: '<p>' | remove: '</p>' }}</figcaption>{% endif %}
</figure>
