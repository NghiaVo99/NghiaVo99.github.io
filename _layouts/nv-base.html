<!doctype html>
{% include base_path %}
<html lang="{{ site.locale | slice: 0,2 | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% include seo.html %}
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (!t) { t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
        if (t === 'dark') { document.documentElement.setAttribute('data-theme', 'dark'); }
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..600&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/nv.css' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M' }}">
  <link rel="stylesheet" href="{{ '/assets/css/icons.css' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M' }}">
  <link rel="stylesheet" href="{{ '/assets/css/academicons.min.css' | relative_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/images/favicon.svg' | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/images/favicon-32x32.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/images/apple-touch-icon-180x180.png' | relative_url }}">
  <link rel="manifest" href="{{ '/images/manifest.json' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  {% include analytics.html %}
</head>
<body class="{{ page.body_class | default: 'page' }}">
  <a class="skip-link" href="#main">Skip to content</a>
  {% include nv-header.html %}
  <main id="main" tabindex="-1">
    {{ content }}
  </main>
  {% include nv-footer.html %}
  <script>
    (function () {
      var btn = document.querySelector('[data-theme-toggle]');
      if (!btn) return;
      function sync() {
        var dark = document.documentElement.getAttribute('data-theme') === 'dark';
        btn.setAttribute('aria-pressed', dark ? 'true' : 'false');
        btn.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
      }
      btn.addEventListener('click', function () {
        var dark = document.documentElement.getAttribute('data-theme') === 'dark';
        if (dark) { document.documentElement.removeAttribute('data-theme'); } else { document.documentElement.setAttribute('data-theme', 'dark'); }
        try { localStorage.setItem('theme', dark ? 'light' : 'dark'); } catch (e) {}
        sync();
      });
      sync();
    })();
  </script>
  {% unless page.no_math %}<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js"></script>{% endunless %}
  {% if page.scripts %}{{ page.scripts }}{% endif %}
</body>
</html>
